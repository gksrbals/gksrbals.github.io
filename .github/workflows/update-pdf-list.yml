name: Update PDF List

on:
  push:
    paths:
      - 'pdfs/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PDF list
        run: |
          find pdfs -maxdepth 1 -name "*.pdf" -printf "%f\n" | sort | jq -R . | jq -s . > pdf-list.json

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pdf-list.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Update pdf-list.json [skip ci]"
          git push
